; Sports Ticker for ESP32-2432S028 ("Cheap Yellow Display")
; Build + flash:  pio run -e cyd -t upload   (from this folder)
; If colors look inverted / the screen stays white, try env cyd2usb.

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/embed_web.py
board_build.partitions = huge_app.csv
lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  bblanchon/ArduinoJson@^7.2.0
  tzapu/WiFiManager@^2.0.17
build_flags =
  -DCORE_DEBUG_LEVEL=1

; Original single micro-USB board (ILI9341 panel)
[env:cyd]

; Two-port (micro-USB + USB-C) board revision (ST7789 panel)
[env:cyd2usb]
build_flags =
  ${env.build_flags}
  -DCYD_ST7789
